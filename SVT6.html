<script>
function corriger1(){
const exo=document.getElementById("exo1");

let bonnes={q1:"3", q2:"3", q3:"1", q4:"2"};

Object.keys(bonnes).forEach(q=>{
  let radios=exo.querySelectorAll("input[name='"+q+"']");
  let checked=[...radios].find(r=>r.checked);

  // RESET complet
  radios.forEach(r=>{
    r.closest(".ligne").classList.remove("correct","incorrect");
  });

  // Bonne réponse TOUJOURS en vert
  radios.forEach(r=>{
    if(r.value===bonnes[q]){
      r.closest(".ligne").classList.add("correct");
    }
  });

  // Gestion de la réponse cochée
  if(checked){
    if(checked.value !== bonnes[q]){
      checked.closest(".ligne").classList.add("incorrect");
    }
  } else {
    // aucune réponse → marquer visuellement
    radios[0].closest(".ligne").classList.add("incorrect");
  }

});

exo.querySelector(".correction").style.display="block";
}
</script>
