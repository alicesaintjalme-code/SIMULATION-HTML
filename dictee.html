<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Entraînement dictée</title>

<style>
body {
  font-family: Arial;
  max-width: 900px;
  margin: auto;
  padding: 20px;
  background: #f7f7f7;
}

.container {
  background: white;
  padding: 20px;
  border-radius: 12px;
}

textarea {
  width: 100%;
  height: 200px;
  padding: 10px;
  border-radius: 8px;
  border: 1px solid #ccc;
}

button {
  margin-top: 10px;
  padding: 10px 15px;
  background: #2ecc71;
  color: white;
  border: none;
  border-radius: 6px;
}

.correct {
  background:#2ecc71;
  color:white;
  padding:2px 4px;
  border-radius:4px;
}

.wrong {
  background:#e74c3c;
  color:white;
  padding:2px 4px;
  border-radius:4px;
  font-weight:bold;
}

.categorie {
  margin-top:10px;
  padding:10px;
  border-radius:8px;
}

.C { background:#ffe5e5; }
.A { background:#e5f0ff; }
.H { background:#fff4e5; }
.L { background:#f0e5ff; }
.P { background:#e5fff2; }
</style>
</head>

<body>

<div class="container">

<h2>✏️ Entraînement dictée</h2>

<textarea id="texte" placeholder="Colle ta dictée ici..."></textarea>

<button onclick="analyser()">Analyser</button>

<div id="resultat"></div>

</div>

<script>

// 🔥 TEXTE OFFICIEL EXACT
let texteOfficiel = `Au temps de ma petite enfance, dans les années 1960, les villageois de mon âge avaient encore un air farouche et sauvage. Ils vivaient dans ces fermes perdues et fréquentaient la classe unique de l’école communale où, l’hiver, ils se rendaient à pied dans la neige. Au cours des années suivantes, en pleine période de croissance, les routes se sont élargies, les supermarchés se sont implantés, le téléphone et la télévision sont arrivés dans la vallée. Les enfants ont grandi et trouvé des emplois en ville. Certains sont devenus ouvriers, d’autres ingénieurs. Les exploitations agricoles ont dépéri avec leurs vieux parents.
Benoît Duteurtre, Livre pour adultes, 2016`;

// 🔥 REGEX accents + apostrophes
const REGEX = /[\p{L}]+(?:['’][\p{L}]+)?|[.,;:!?]/gu;

// 🔹 catégories
let nomsTypes = {
  C: "Conjugaison",
  A: "Accord",
  H: "Homonymes",
  L: "Orthographe",
  P: "Ponctuation"
};

// 🔹 classification simple
function classerErreur(tC) {
  if (/[.,;:!?]/.test(tC)) return "P";
  return "L";
}

// 🔥 comparaison + détection
function comparer(texteEleve, texteCorrect, groupes) {

  const tokensCorrect = texteCorrect.match(REGEX) || [];
  const tokensEleve = texteEleve.match(REGEX) || [];

  let resultat = "";

  let i = 0;
  let j = 0;

  while (i < tokensCorrect.length) {

    let tC = tokensCorrect[i];
    let tE = tokensEleve[j];

    // ponctuation
    if (/[.,;:!?]/.test(tC)) {

      if (tE === tC) {
        resultat += `<span class="correct">${tC}</span> `;
        j++;
      } else {
        resultat += `<span class="wrong">${tC}</span> `;
        groupes["P"].push({
          texte: tC,
          message: "Ponctuation manquante ou incorrecte"
        });
      }

      i++;
      continue;
    }

    // mots
    if (tE && tE.toLowerCase() === tC.toLowerCase()) {
      resultat += `<span class="correct">${tC}</span> `;
      i++;
      j++;
    } else {
      resultat += `<span class="wrong">${tC}</span> `;
      groupes["L"].push({
        texte: tC,
        message: "Mot incorrect ou manquant"
      });

      i++;
      if (tE) j++;
    }
  }

  return resultat;
}

// 🔥 analyse complète
function analyser() {

  let texte = document.getElementById("texte").value;

  if (!texte.trim()) {
    document.getElementById("resultat").innerHTML = "⚠️ Écris un texte avant d’analyser.";
    return;
  }

  let groupes = {C:[], A:[], H:[], L:[], P:[]};

  let correction = comparer(texte, texteOfficiel, groupes);

  let html = "<h3>📊 Détail des erreurs</h3>";

  for (let type in groupes) {

    if (groupes[type].length === 0) continue;

    html += `<div class="categorie ${type}">
    <b>${nomsTypes[type]}</b> (${groupes[type].length})<br><br>`;

    groupes[type].forEach(e => {
      html += `❌ ${e.texte} → ${e.message}<br>`;
    });

    html += "</div>";
  }

  html += `
  <h3>🔁 Correction</h3>
  <p style="line-height:1.8;">${correction}</p>
  `;

  document.getElementById("resultat").innerHTML = html;
}

</script>

</body>
</html>
