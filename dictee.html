<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Entraînement dictée</title>

<style>
body {
  font-family: Arial;
  max-width: 900px;
  margin: auto;
  padding: 20px;
  background: #f7f7f7;
}

.container {
  background: white;
  padding: 20px;
  border-radius: 12px;
}

textarea {
  width: 100%;
  height: 200px;
  padding: 10px;
  border-radius: 8px;
  border: 1px solid #ccc;
}

button {
  margin-top: 10px;
  padding: 10px 15px;
  background: #2ecc71;
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

.correct {
  background:#2ecc71;
  color:white;
  padding:2px 4px;
  border-radius:4px;
}

.wrong {
  background:#e74c3c;
  color:white;
  padding:2px 4px;
  border-radius:4px;
  font-weight:bold;
  cursor:pointer;
}

.info {
  font-size:14px;
  color:#555;
  margin-top:10px;
}
</style>
</head>

<body>

<div class="container">

<h2>✏️ Entraînement dictée</h2>

<textarea id="texte" placeholder="Colle ta dictée ici..."></textarea>

<button onclick="analyser()">Analyser</button>

<div id="resultat"></div>

<p class="info">
💡 Clique sur les éléments en rouge pour corriger automatiquement.
</p>

</div>

<script>

// 🔥 TEXTE OFFICIEL
let texteOfficiel = "Au temps de ma petite enfance, dans les années 1960, les villageois de mon âge avaient encore un air farouche et sauvage. Ils vivaient dans ces fermes perdues et fréquentaient la classe unique de l’école communale où, l’hiver, ils se rendaient à pied dans la neige. Au cours des années suivantes, en pleine période de croissance, les routes se sont élargies, les supermarchés se sont implantés, le téléphone et la télévision sont arrivés dans la vallée. Les enfants ont grandi et trouvé des emplois en ville. Certains sont devenus ouvriers, d’autres ingénieurs. Les exploitations agricoles ont dépéri avec leurs vieux parents. Benoît Duteurtre, Livre pour adultes, 2016";

// 🔥 remplacement fiable
function remplacerMot(index, motCorrect) {

  let textarea = document.getElementById("texte");
  let texte = textarea.value;

  let tokens = texte.match(/\w+|[.,;:!?]/g) || [];

  if (index >= tokens.length) return;

  tokens[index] = motCorrect;

  // reconstruction propre
  let nouveauTexte = "";
  tokens.forEach((t, i) => {
    if (i > 0 && !/[.,;:!?]/.test(t)) {
      nouveauTexte += " ";
    }
    nouveauTexte += t;
  });

  textarea.value = nouveauTexte;
}

// 🔥 comparaison robuste
function comparer(texteEleve, texteCorrect) {

  const tokensCorrect = texteCorrect.match(/\w+|[.,;:!?]/g) || [];
  const tokensEleve = texteEleve.match(/\w+|[.,;:!?]/g) || [];

  let i = 0;
  let j = 0;
  let indexEleve = 0;
  let resultat = "";

  while (i < tokensCorrect.length) {

    let tC = tokensCorrect[i];
    let tE = tokensEleve[j];

    // ponctuation
    if (/[.,;:!?]/.test(tC)) {

      if (tE === tC) {
        resultat += `<span class="correct">${tC}</span> `;
        j++;
        indexEleve++;
      } else {
        resultat += `<span class="wrong" onclick="remplacerMot(${indexEleve}, '${tC}')">${tC}</span> `;
      }

      i++;
      continue;
    }

    // mots
    if (tE && tE.toLowerCase() === tC.toLowerCase()) {
      resultat += `<span class="correct">${tC}</span> `;
      i++;
      j++;
      indexEleve++;
    } else {
      resultat += `<span class="wrong" onclick="remplacerMot(${indexEleve}, '${tC}')">${tC}</span> `;
      i++;
      if (tE) {
        j++;
        indexEleve++;
      }
    }
  }

  return resultat;
}

// 🔥 analyse
function analyser() {

  let texte = document.getElementById("texte").value;

  if (!texte.trim()) {
    document.getElementById("resultat").innerHTML = "⚠️ Écris un texte avant d’analyser.";
    return;
  }

  let correction = comparer(texte, texteOfficiel);

  document.getElementById("resultat").innerHTML = `
    <h3>🔁 Correction interactive</h3>
    <p><b>❌ Ton texte :</b><br>${texte}</p>
    <p><b>✅ Clique pour corriger :</b><br>${correction}</p>
  `;
}

</script>

</body>
</html>
