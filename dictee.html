<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Correction Dictée (Entraînement)</title>

<style>

body {
  font-family: Arial;
  max-width: 800px;
  margin: auto;
}

textarea {
  width: 100%;
  height: 150px;
}

button {
  padding: 10px 20px;
  margin-top: 10px;
}

.categorie {
  border-radius: 10px;
  padding: 10px;
  margin-bottom: 15px;
}

.C { background: #ffe5e5; }
.A { background: #e5f0ff; }
.H { background: #fff4e5; }
.L { background: #f0e5ff; }
.P { background: #e5fff2; }

.erreur {
  margin: 5px 0;
  padding-left: 10px;
}

.feedback {
  font-style: italic;
  margin-top: 5px;
}

.correction-finale {
  background: #e8f8f5;
  padding: 15px;
  border-radius: 10px;
  margin-top: 20px;
  border-left: 6px solid #2ecc71;
}

.highlight {
  background: #2ecc71;
  color: white;
  padding: 2px 4px;
  border-radius: 4px;
}

.avant {
  background: #ffecec;
  padding: 10px;
  border-radius: 8px;
}

.apres {
  background: #e8f8f5;
  padding: 10px;
  border-radius: 8px;
  margin-top: 10px;
}

</style>
</head>

<body>

<h2>✏️ Entraînement dictée</h2>

<textarea id="texte" placeholder="Colle ta dictée ici..."></textarea>
<br>
<button onclick="analyser()">Analyser</button>

<h3>Résultats :</h3>
<div id="resultat"></div>

<div id="correctionFinale"></div>

<script>

// 🔹 Ignorer erreurs inutiles
function ignorerErreur(message) {
  message = message.toLowerCase();
  return message.includes("virgule conseillée") ||
         message.includes("ponctuation conseillée") ||
         message.includes("style");
}

// 🔹 Classification
function classerErreur(message) {
  message = message.toLowerCase();
  if (message.includes("verbe") || message.includes("participe")) return "C";
  if (message.includes("accord")) return "A";
  if (message.includes("ponctuation") || message.includes("virgule")) return "P";
  if (message.includes("homonyme")) return "H";
  return "L";
}

let labels = {
  C: "Fautes de conjugaison",
  A: "Fautes d’accord",
  H: "Fautes d’homonymes",
  L: "Fautes lexicales / orthographe",
  P: "Fautes de ponctuation"
};

let feedbacks = {
  C: "👉 Vérifie le sujet et le temps du verbe.",
  A: "👉 Attention aux accords (genre et nombre).",
  H: "👉 Vérifie les mots qui se prononcent pareil.",
  L: "👉 Relis l’orthographe des mots.",
  P: "👉 Attention à la ponctuation."
};

async function analyser() {

  let texte = document.getElementById("texte").value;

  let response = await fetch("https://api.languagetool.org/v2/check", {
    method: "POST",
    headers: {"Content-Type": "application/x-www-form-urlencoded"},
    body: `text=${encodeURIComponent(texte)}&language=fr`
  });

  let data = await response.json();
  let erreurs = data.matches;

  let groupes = {C:[], A:[], H:[], L:[], P:[]};
  let corrections = [];

  erreurs.forEach(e => {

    if (ignorerErreur(e.message)) return;

    let type = classerErreur(e.message);

    let correction = e.replacements.length > 0 ? e.replacements[0].value : null;

    if (correction) {
      corrections.push({
        offset: e.offset,
        length: e.length,
        correction: correction
      });
    }

    groupes[type].push({
      texte: e.context.text,
      message: e.message,
      correction: correction
    });
  });

  // 🔹 Appliquer corrections
  corrections.sort((a, b) => b.offset - a.offset);

  let texteCorrige = texte;

  corrections.forEach(c => {
    texteCorrige =
      texteCorrige.substring(0, c.offset) +
      c.correction +
      texteCorrige.substring(c.offset + c.length);
  });

  // 🔹 Version surlignée
  let texteSurligne = texte;

  corrections.forEach(c => {
    texteSurligne =
      texteSurligne.substring(0, c.offset) +
      `<span class="highlight">${c.correction}</span>` +
      texteSurligne.substring(c.offset + c.length);
  });

  // 🔹 Affichage erreurs
  let html = "";

  for (let type in groupes) {

    if (groupes[type].length === 0) continue;

    html += `<div class="categorie ${type}">
      <h4>📌 ${labels[type]}</h4>`;

    groupes[type].forEach(e => {

      let correctionHTML = e.correction
        ? `<br>✅ Correction : <b>${e.correction}</b>`
        : "";

      html += `<div class="erreur">
        ❌ ${e.texte}<br>
        ➜ ${e.message}
        ${correctionHTML}
      </div>`;
    });

    html += `<div class="feedback">${feedbacks[type]}</div>`;
    html += `</div>`;
  }

  document.getElementById("resultat").innerHTML = html;

  // 🔹 Avant / Après
  document.getElementById("correctionFinale").innerHTML = `
    <div class="correction-finale">
      <h3>🔁 Avant / Après</h3>

      <div class="avant">
        <b>❌ Texte original :</b><br>
        ${texte}
      </div>

      <div class="apres">
        <b>✅ Texte corrigé :</b><br>
        ${texteSurligne}
      </div>
    </div>
  `;
}

</script>

</body>
</html>
