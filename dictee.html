<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Entraînement dictée</title>

<style>
body {
  font-family: Arial;
  max-width: 900px;
  margin: auto;
  padding: 20px;
  background: #f7f7f7;
}

.container {
  background: white;
  padding: 20px;
  border-radius: 12px;
}

textarea {
  width: 100%;
  height: 200px;
  padding: 10px;
  border-radius: 8px;
  border: 1px solid #ccc;
}

button {
  margin-top: 10px;
  padding: 10px 15px;
  background: #2ecc71;
  color: white;
  border: none;
  border-radius: 6px;
}

.correct {
  background:#2ecc71;
  color:white;
  padding:2px;
}

.wrong {
  background:#e74c3c;
  color:white;
  padding:2px;
  cursor:pointer;
}

.categorie {
  margin-top: 10px;
  padding: 10px;
  border-radius: 8px;
}

.C { background:#ffe5e5; }
.A { background:#e5f0ff; }
.H { background:#fff4e5; }
.L { background:#f0e5ff; }
.P { background:#e5fff2; }

</style>
</head>

<body>

<div class="container">

<h2>✏️ Entraînement dictée</h2>

<textarea id="texte"></textarea>

<button onclick="analyser()">Analyser</button>

<div id="resultat"></div>

</div>

<script>

let texteOfficiel = "Au temps de ma petite enfance, dans les années 1960, les villageois de mon âge avaient encore un air farouche et sauvage.";

let tokensEleveGlobal = [];

// 🔹 noms lisibles
let nomsTypes = {
  C: "🔴 Conjugaison",
  A: "🔵 Accord",
  H: "🟠 Homonymes",
  L: "🟣 Orthographe",
  P: "🟢 Ponctuation"
};

// 🔹 classification
function classerErreur(message) {
  message = message.toLowerCase();
  if (message.includes("verbe")) return "C";
  if (message.includes("accord")) return "A";
  if (message.includes("ponctuation")) return "P";
  if (message.includes("homonyme")) return "H";
  return "L";
}

// 🔥 remplacement fiable
function remplacerMot(index, motCorrect) {

  tokensEleveGlobal[index] = motCorrect;

  let texte = "";
  tokensEleveGlobal.forEach((t,i)=>{
    if(i>0 && !/[.,;:!?]/.test(t)) texte+=" ";
    texte+=t;
  });

  document.getElementById("texte").value = texte;
}

// 🔥 comparaison + clic
function comparer(texteEleve, texteCorrect) {

  const tokensCorrect = texteCorrect.match(/\w+|[.,;:!?]/g) || [];
  tokensEleveGlobal = texteEleve.match(/\w+|[.,;:!?]/g) || [];

  let resultat = "";
  let i=0, j=0;

  while(i < tokensCorrect.length){

    let tC = tokensCorrect[i];
    let tE = tokensEleveGlobal[j];

    if(/[.,;:!?]/.test(tC)){
      if(tE===tC){
        resultat+=`<span class="correct">${tC}</span> `;
        j++;
      }else{
        resultat+=`<span class="wrong" onclick="remplacerMot(${j}, '${tC}')">${tC}</span> `;
      }
      i++;
      continue;
    }

    if(tE && tE.toLowerCase()===tC.toLowerCase()){
      resultat+=`<span class="correct">${tC}</span> `;
      i++; j++;
    }else{
      resultat+=`<span class="wrong" onclick="remplacerMot(${j}, '${tC}')">${tC}</span> `;
      i++;
      if(tE) j++;
    }
  }

  return resultat;
}

async function analyser(){

  let texte = document.getElementById("texte").value;

  if(!texte.trim()){
    document.getElementById("resultat").innerHTML="⚠️ Écris un texte";
    return;
  }

  // 🔥 appel LanguageTool
  let response = await fetch("https://api.languagetool.org/v2/check", {
    method: "POST",
    headers: {"Content-Type":"application/x-www-form-urlencoded"},
    body: `text=${encodeURIComponent(texte)}&language=fr`
  });

  let data = await response.json();
  let erreurs = data.matches;

  let groupes = {C:[],A:[],H:[],L:[],P:[]};

  erreurs.forEach(e=>{
    let type = classerErreur(e.message);
    groupes[type].push({
      texte:e.context.text,
      message:e.message
    });
  });

  let html = "<h3>📊 Analyse des erreurs</h3>";

  for(let type in groupes){
    if(groupes[type].length===0) continue;

    html+=`<div class="categorie ${type}">
    <b>${nomsTypes[type]}</b> (${groupes[type].length})<br><br>`;

    groupes[type].forEach(e=>{
      html+=`❌ ${e.texte}<br>➡️ ${e.message}<br><br>`;
    });

    html+="</div>";
  }

  let correction = comparer(texte, texteOfficiel);

  html+=`
  <h3>🔁 Correction interactive</h3>
  ${correction}
  `;

  document.getElementById("resultat").innerHTML = html;
}

</script>

</body>
</html>
