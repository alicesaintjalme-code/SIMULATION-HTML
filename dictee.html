<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Entraînement dictée</title>

<style>
body {
  font-family: Arial;
  max-width: 900px;
  margin: auto;
  padding: 20px;
  background: #f7f7f7;
}

.container {
  background: white;
  padding: 20px;
  border-radius: 12px;
}

textarea {
  width: 100%;
  height: 200px;
  padding: 10px;
  border-radius: 8px;
  border: 1px solid #ccc;
}

button {
  margin-top: 10px;
  padding: 10px 15px;
  background: #2ecc71;
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

.categorie {
  border-radius: 10px;
  padding: 10px;
  margin-top: 15px;
}

.C { background: #ffe5e5; }
.A { background: #e5f0ff; }
.H { background: #fff4e5; }
.L { background: #f0e5ff; }
.P { background: #e5fff2; }

.correct { background:#2ecc71; color:white; padding:2px 4px; border-radius:4px; }
.wrong { background:#e74c3c; color:white; padding:2px 4px; border-radius:4px; }

.info {
  font-size:14px;
  color:#555;
  margin-top:10px;
}
</style>
</head>

<body>

<div class="container">

<h2>✏️ Entraînement dictée</h2>

<textarea id="texte" placeholder="Colle ta dictée ici..."></textarea>

<button onclick="analyser()">Analyser</button>

<div id="resultat"></div>

<p class="info">
💡 Cet outil t’aide à repérer tes erreurs. Certaines corrections sont des suggestions.
</p>

</div>

<script>

// 🔥 TEXTE OFFICIEL
let texteOfficiel = "Au temps de ma petite enfance, dans les années 1960, les villageois de mon âge avaient encore un air farouche et sauvage. Ils vivaient dans ces fermes perdues et fréquentaient la classe unique de l’école communale où, l’hiver, ils se rendaient à pied dans la neige. Au cours des années suivantes, en pleine période de croissance, les routes se sont élargies, les supermarchés se sont implantés, le téléphone et la télévision sont arrivés dans la vallée. Les enfants ont grandi et trouvé des emplois en ville. Certains sont devenus ouvriers, d’autres ingénieurs. Les exploitations agricoles ont dépéri avec leurs vieux parents. Benoît Duteurtre, Livre pour adultes, 2016";

// 🔹 noms élèves
let nomsTypes = {
  C: "🔴 Conjugaison",
  A: "🔵 Accord",
  H: "🟠 Homonymes",
  L: "🟣 Mots mal écrits",
  P: "🟢 Ponctuation"
};

// 🔹 classification
function classerErreur(message) {
  message = message.toLowerCase();
  if (message.includes("verbe")) return "C";
  if (message.includes("accord")) return "A";
  if (message.includes("ponctuation")) return "P";
  if (message.includes("homonyme")) return "H";
  return "L";
}

// 🔹 ignorer noms propres
function estNomPropre(mot) {
  return /^[A-ZÀ-Ü]/.test(mot);
}

// 🔹 normaliser
function normaliser(t) {
  return t.toLowerCase().replace(/[.,;:!?]/g,"").replace(/\s+/g," ").trim();
}

// 🔹 comparaison fiable
function comparer(texteEleve, texteCorrect) {

  let eleve = normaliser(texteEleve).split(" ");
  let correct = normaliser(texteCorrect).split(" ");
  let original = texteCorrect.split(" ");

  let resultat = "";

  for (let i=0;i<correct.length;i++) {
    if (eleve[i] === correct[i]) {
      resultat += `<span class="correct">${original[i]}</span> `;
    } else {
      resultat += `<span class="wrong">${original[i]}</span> `;
    }
  }

  return resultat;
}

// 🔥 ponctuation simple et fiable
function analyserPonctuation(texteEleve) {

  let erreurs = [];

  // majuscule début
  if (texteEleve.length > 0 && texteEleve[0] === texteEleve[0].toLowerCase()) {
    erreurs.push({
      texte: texteEleve.slice(0, 20),
      message: "La phrase doit commencer par une majuscule"
    });
  }

  // majuscule après point (corrigé)
  let phrases = texteEleve.split(".").filter(p => p.trim() !== "");
  phrases.forEach(p => {
    let phrase = p.trim();
    if (phrase && phrase[0] === phrase[0].toLowerCase()) {
      erreurs.push({
        texte: phrase.slice(0, 20),
        message: "Majuscule attendue après un point"
      });
    }
  });

  // ponctuation globale (corrigé)
  let nbPoints = (texteEleve.match(/\./g) || []).length;
  if (nbPoints < 1) {
    erreurs.push({
      texte: texteEleve.slice(0, 30),
      message: "Il manque de la ponctuation (phrases non séparées)"
    });
  }

  return erreurs;
}

async function analyser() {

  let texte = document.getElementById("texte").value;

  // 🔥 sécurité champ vide
  if (!texte.trim()) {
    document.getElementById("resultat").innerHTML = "⚠️ Écris un texte avant d’analyser.";
    return;
  }

  let response = await fetch("https://api.languagetool.org/v2/check", {
    method: "POST",
    headers: {"Content-Type":"application/x-www-form-urlencoded"},
    body: `text=${encodeURIComponent(texte)}&language=fr`
  });

  let data = await response.json();
  let erreurs = data.matches;

  let groupes = {C:[], A:[], H:[], L:[], P:[]};

  // 🔹 erreurs IA
  erreurs.forEach(e => {

    let texteErreur = e.context.text;
    let mots = texteErreur.split(" ");
    let mot = mots.find(m => m.length>2) || "";

    if (estNomPropre(mot)) return;

    let type = classerErreur(e.message);

    groupes[type].push({
      texte: texteErreur,
      message: e.message
    });

  });

  // 🔥 ponctuation fiable
  let erreursP = analyserPonctuation(texte);
  erreursP.forEach(e => groupes["P"].push(e));

  let html = "<h3>📊 Analyse des erreurs</h3>";

  for (let type in groupes) {

    if (groupes[type].length === 0) continue;

    html += `<div class="categorie ${type}">
    <b>${nomsTypes[type]}</b> – ${groupes[type].length} erreur(s)<br><br>`;

    groupes[type].forEach(e => {
      html += `❌ ${e.texte}<br>➡️ ${e.message}<br><br>`;
    });

    html += "</div>";
  }

  let correction = comparer(texte, texteOfficiel);

  html += `
  <h3>🔁 Correction fiable</h3>

  <p><b>❌ Ton texte :</b><br>${texte}</p>

  <p><b>✅ Texte correct :</b><br>${correction}</p>
  `;

  document.getElementById("resultat").innerHTML = html;
}

</script>

</body>
</html>
