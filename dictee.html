<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Correction Dictée</title>

<style>

body {
  font-family: Arial;
  max-width: 800px;
  margin: auto;
}

textarea {
  width: 100%;
  height: 150px;
}

button {
  padding: 10px 20px;
  margin-top: 10px;
}

.categorie {
  border-radius: 10px;
  padding: 10px;
  margin-bottom: 15px;
}

.C { background: #ffe5e5; }
.A { background: #e5f0ff; }
.H { background: #fff4e5; }
.L { background: #f0e5ff; }
.P { background: #e5fff2; }

.erreur {
  margin: 5px 0;
  padding-left: 10px;
}

.feedback {
  font-style: italic;
  margin-top: 5px;
}

.correction-finale {
  background: #e8f8f5;
  padding: 15px;
  border-radius: 10px;
  margin-top: 20px;
  border-left: 6px solid #2ecc71;
}

.highlight {
  background: #2ecc71;
  color: white;
  padding: 2px 4px;
  border-radius: 4px;
}

.avant {
  background: #ffecec;
  padding: 10px;
  border-radius: 8px;
}

.apres {
  background: #e8f8f5;
  padding: 10px;
  border-radius: 8px;
  margin-top: 10px;
}

</style>
</head>

<body>

<h2>✏️ Correction de dictée</h2>

<textarea id="texte" placeholder="Colle ta dictée ici..."></textarea>
<br>
<button onclick="analyser()">Analyser</button>

<h3>Résultats :</h3>
<div id="resultat"></div>

<h3 id="note"></h3>
<div id="correctionFinale"></div>

<script>

let bareme = {
  C: 1,
  A: 1,
  H: 0.5,
  L: 0.5,
  P: 0.25
};

function ignorerErreur(message) {
  message = message.toLowerCase();
  return message.includes("virgule conseillée") ||
         message.includes("ponctuation conseillée") ||
         message.includes("style");
}

function classerErreur(message) {
  message = message.toLowerCase();
  if (message.includes("verbe") || message.includes("participe")) return "C";
  if (message.includes("accord")) return "A";
  if (message.includes("ponctuation") || message.includes("virgule")) return "P";
  if (message.includes("homonyme")) return "H";
  return "L";
}

function evaluerNiveau(note) {
  if (note >= 17) return {niveau:"Excellent", couleur:"#2ecc71"};
  if (note >= 14) return {niveau:"Très bien", couleur:"#27ae60"};
  if (note >= 11) return {niveau:"Bien", couleur:"#f1c40f"};
  if (note >= 8) return {niveau:"À renforcer", couleur:"#e67e22"};
  return {niveau:"À revoir", couleur:"#e74c3c"};
}

async function analyser() {

  let texte = document.getElementById("texte").value;

  let response = await fetch("https://api.languagetool.org/v2/check", {
    method: "POST",
    headers: {"Content-Type": "application/x-www-form-urlencoded"},
    body: `text=${encodeURIComponent(texte)}&language=fr`
  });

  let data = await response.json();
  let erreurs = data.matches;

  let total = 20;
  let corrections = [];

  erreurs.forEach(e => {

    if (ignorerErreur(e.message)) return;

    let type = classerErreur(e.message);
    total -= bareme[type];

    if (e.replacements.length > 0) {
      corrections.push({
        offset: e.offset,
        length: e.length,
        correction: e.replacements[0].value
      });
    }
  });

  total = Math.max(total, 5);

  // 🔥 Trier corrections (important)
  corrections.sort((a, b) => b.offset - a.offset);

  let texteCorrige = texte;

  corrections.forEach(c => {
    texteCorrige =
      texteCorrige.substring(0, c.offset) +
      c.correction +
      texteCorrige.substring(c.offset + c.length);
  });

  // 🔥 Version surlignée
  let texteSurligne = texte;

  corrections.forEach(c => {
    texteSurligne =
      texteSurligne.substring(0, c.offset) +
      `<span class="highlight">${c.correction}</span>` +
      texteSurligne.substring(c.offset + c.length);
  });

  let evaluation = evaluerNiveau(total);

  document.getElementById("note").innerHTML = `
    <div style="padding:15px; background:${evaluation.couleur}20; border-left:6px solid ${evaluation.couleur}">
      <h3>📝 Note : ${total.toFixed(2)}/20</h3>
      <h4>${evaluation.niveau}</h4>
    </div>
  `;

  document.getElementById("correctionFinale").innerHTML = `
    <div class="correction-finale">
      <h3>🔁 Avant / Après</h3>

      <div class="avant">
        <b>❌ Texte original :</b><br>
        ${texte}
      </div>

      <div class="apres">
        <b>✅ Texte corrigé :</b><br>
        ${texteSurligne}
      </div>
    </div>
  `;
}

</script>

</body>
</html>
