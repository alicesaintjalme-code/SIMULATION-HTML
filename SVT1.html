<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Quiz SVT</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f6f8;
  padding: 20px;
}

.container {
  max-width: 700px;
  margin: auto;
  background: white;
  padding: 20px;
  border-radius: 10px;
}

h2 {
  color: #2c3e50;
}

.question {
  margin-bottom: 20px;
}

button {
  background: #4CAF50;
  color: white;
  padding: 10px;
  border: none;
  border-radius: 5px;
  cursor: pointer;
}

button:hover {
  background: #45a049;
}

.result {
  margin-top: 20px;
  font-weight: bold;
}

.correct {
  color: green;
}

.incorrect {
  color: red;
}
</style>
</head>

<body>

<div class="container">

<h2>🟦 Exercice — Cycle de l'eau</h2>

<form id="quiz">

<div class="question">
<p>1. L'eau s'évapore grâce à la chaleur.</p>
<label><input type="radio" name="q1" value="true"> Vrai</label><br>
<label><input type="radio" name="q1" value="false"> Faux</label>
</div>

<div class="question">
<p>2. Il y a précipitation lorsqu’il fait chaud.</p>
<label><input type="radio" name="q2" value="true"> Vrai</label><br>
<label><input type="radio" name="q2" value="false"> Faux</label>
</div>

<div class="question">
<p>3. La vapeur d'eau se condense et forme un nuage.</p>
<label><input type="radio" name="q3" value="true"> Vrai</label><br>
<label><input type="radio" name="q3" value="false"> Faux</label>
</div>

<div class="question">
<p>4. Coche les affirmations correctes :</p>

<label><input type="checkbox" name="q4" value="1"> Les mouvements des masses d'air sont à l'origine des vents</label><br>
<label><input type="checkbox" name="q4" value="2"> L'air chaud est moins dense donc il descend</label><br>
<label><input type="checkbox" name="q4" value="3"> L'air chaud monte en altitude</label><br>
<label><input type="checkbox" name="q4" value="4"> Les masses d'eau sont mises en mouvement par les vents</label><br>
<label><input type="checkbox" name="q4" value="5"> Les masses d'air sont mises en mouvement par les courants</label><br>
<label><input type="checkbox" name="q4" value="6"> L'eau chaude monte en surface</label>

</div>

<button type="button" onclick="corriger()">Valider</button>

<div class="result" id="result"></div>

</form>

</div>

<script>
function corriger() {
  let score = 0;
  let total = 4;

  // Q1
  if (document.querySelector('input[name="q1"]:checked')?.value === "true") {
    score++;
  }

  // Q2
  if (document.querySelector('input[name="q2"]:checked')?.value === "false") {
    score++;
  }

  // Q3
  if (document.querySelector('input[name="q3"]:checked')?.value === "true") {
    score++;
  }

  // Q4
  let bonnes = ["1","3","4","6"];
  let cochées = Array.from(document.querySelectorAll('input[name="q4"]:checked')).map(el => el.value);

  if (bonnes.length === cochées.length && bonnes.every(v => cochées.includes(v))) {
    score++;
  }

  let resultat = document.getElementById("result");

  resultat.innerHTML = "Score : " + score + " / " + total;

  if (score === total) {
    resultat.className = "result correct";
  } else {
    resultat.className = "result incorrect";
  }
}
</script>

</body>
</html>
